# PixelForge Model Configuration
# ================================
# This file defines the ONNX models used by PixelForge.
# Edit the URLs if you need to use mirrors or different model variants.
#
# To manually download models:
# 1. Create a 'models/' folder next to the executable
# 2. Download each model using the URL below
# 3. Rename the downloaded file to match the 'filename' field
#
# Three models are used by the pipeline:
#   - Depth-Anything V2 Small (depth estimation)
#   - DexiNed (edge detection)
#   - AnimeSegment (foreground/background segmentation for anime-style images)
#
# Depth + edge are hosted in the user's HuggingFace repo:
#   https://huggingface.co/SStahan/ONNX-exports-dpt-seg-edge-face
#
# AnimeSegment is from skytnt/anime-seg on HuggingFace:
#   https://huggingface.co/skytnt/anime-seg

[models.depth_anything]
# Depth-Anything V2 Small (ViT-S): Monocular depth estimation
# Output: Relative depth map (higher = farther from camera)
# ViT-S is ~14× smaller than ViT-L (94 MB vs 1.34 GB) with only slightly
# worse accuracy. Download is fast and VRAM usage is modest.
name = "Depth-Anything V2 Small"
filename = "depth_anything_v2_vits.onnx"
url = "https://huggingface.co/SStahan/ONNX-exports-dpt-seg-edge-face/resolve/main/depth_anything_v2_vits.onnx"
size_mb = 94.4
description = "Depth estimation for depth-to-flat color conversion (ViT-S)"
enabled = true

[models.edge_detection]
# DexiNed: Dense Extreme Inception Network for Edge Detection
# Output: Edge probability map [0,1] at input resolution
# Architecture: ~133 MB, fixed 512×512 input (auto-detected at load time)
#
# Replaces TEED in the original plan — TEED had no canonical ONNX export on
# HuggingFace. DexiNed is a comparable perceptual edge detector that produces
# crisp, thin edges suitable for the outline pass. The edge detector module
# (`ml/models/teed.rs`) auto-detects whether the loaded model has dynamic or
# fixed input dimensions and handles both cases.
name = "DexiNed"
filename = "dexined.onnx"
url = "https://huggingface.co/SStahan/ONNX-exports-dpt-seg-edge-face/resolve/main/dexined.onnx"
size_mb = 133.8
description = "Perceptual edge detection for the outline pass"
enabled = true

[models.segmentation]
# AnimeSegment: Foreground/background segmentation for anime-style images
# Output: Single-channel probability mask [0,1] — 1.0 = foreground (character),
# 0.0 = background. Trained specifically on anime illustrations, so it works
# reliably on cel-shaded content where generic segmentation models fail.
#
# Used by the depth-to-flat stage to classify background pixels with 100%
# accuracy (replaces the SLIC-based heuristic that misclassified dress
# regions as background). Also available to the edge pass for true silhouette
# detection and to palette extraction for foreground-only sampling.
#
# Architecture: IS-Net (Information Segmentation Network), ~168 MB, dynamic
# input resolution. Falls back to SLIC-based classification when the model
# is not available.
#
# Source: skytnt/anime-seg on HuggingFace (file: isnetis.onnx)
name = "AnimeSegment"
filename = "anime_segment.onnx"
url = "https://huggingface.co/skytnt/anime-seg/resolve/main/isnetis.onnx"
size_mb = 168.0
description = "Anime foreground/background segmentation (replaces SLIC for bg classification)"
enabled = true

# ============================================================================
# ADDITIONAL MODELS (available in the repo but NOT used by the pipeline)
# ============================================================================
# The following models were exported to ONNX by the user but are intentionally
# disabled. The pipeline repurpose plan explicitly dropped face detection and
# semantic parsing because:
#   - BiSeNet (face parsing) doesn't work on anime-style images
#   - YOLOv8n-Face's only consumer was BiSeNet (for face cropping)
#   - "Two logic paths for photo vs anime" was explicitly rejected
#
# They are listed here as commented entries for reference. Uncomment and set
# `enabled = true` only if you decide to deviate from the plan (and note the
# deviation in the worklog).

