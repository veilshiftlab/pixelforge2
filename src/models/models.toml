# PixelForge Model Configuration
# ================================
# This file defines the ONNX models used by PixelForge.
# Edit the URLs if you need to use mirrors or different model variants.
#
# To manually download models:
# 1. Create a 'models/' folder next to the executable
# 2. Download each model using the URL below
# 3. Rename the downloaded file to match the 'filename' field

[models.yolov8_face]
# YOLOv8n-Face: Face detection with 5 landmarks
# Output: Bounding box + 5 facial landmarks (eyes, nose, mouth corners)
name = "YOLOv8n-Face"
filename = "yolov8n-face.onnx"
url = "https://huggingface.co/onnx-community/yolov8n-face/resolve/main/onnx/model.onnx"
size_mb = 6.0
description = "Face detection with 5 landmarks (eyes, nose, mouth corners)"
enabled = true

[models.depth_anything]
# Depth-Anything V2 Small: Monocular depth estimation
# Output: Relative depth map (higher = farther from camera)
# Using ViT-S (Small) for better 4GB VRAM compatibility
name = "Depth-Anything V2 Small"
filename = "depth-anything-v2-small.onnx"
url = "https://huggingface.co/depth-anything/Depth-Anything-V2-Small/resolve/main/depth_anything_v2_vits.onnx"
size_mb = 100.0
description = "Depth estimation for depth-to-flat color conversion (ViT-S)"
enabled = true

[models.bisenet]
# BiSeNet: Face parsing / semantic segmentation
# Output: Per-pixel labels for 19 face regions (skin, hair, eyes, lips, etc.)
name = "BiSeNet Face Parsing"
filename = "bisenet.onnx"
# Alternative mirrors (uncomment one if primary fails):
# url = "https://huggingface.co/YOLOPVN/bisenet_face_parsing/resolve/main/bisenet.onnx"
url = "https://huggingface.co/szhubel/face-parsing-bisenet/resolve/main/bisenet.onnx"
size_mb = 48.0
description = "Face parsing for region-aware processing (19 classes)"
enabled = true

