# ============================================================================
# DOWNLOAD SETTINGS
# ============================================================================
[download]
# Maximum concurrent downloads
max_concurrent = 2
# Connection timeout in seconds
timeout = 300
# Number of retry attempts
retries = 3
# Verify file exists after download
verify_exists = true
