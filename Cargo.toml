[package]
name = "pixelforge"
version = "0.1.0"
edition = "2021"
authors = ["PixelForge Team"]
description = "ML-enhanced pixel art style transfer for character portraits"
license = "MIT"

[dependencies]
# GUI Framework
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
] }
egui_extras = { version = "0.29", features = ["image"] }

# Image Processing
image = { version = "0.25", features = ["png", "jpeg", "webp"] }

# ML Inference (ONNX Runtime)
#
# `download-binaries` fetches a pre-built ONNX Runtime shared library at build
# time that matches the ort crate's expected version (>=1.23.x for ort 2.0-rc.11).
#
# Phase 7 — removed `cuda` feature: user confirmed no CUDA GPU in workspace.
# Without CUDA, the cuda EP was just adding ~5 minutes to release builds
# (it compiles CUDA stub libraries even when not used). If GPU acceleration
# is needed later, re-add `cuda` here and the workspace will need a CUDA
# toolkit install.
#
# Do NOT add `load-dynamic` — that feature makes ort look for a system
# `onnxruntime.dll` at runtime, which can pick up an older version (e.g. 1.17.1
# from another tool) and cause a version-mismatch panic at startup.
ort = { version = "2.0.0-rc.11", features = [
    "download-binaries",
] }
ndarray = "0.15"

# Parallel Processing
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File Handling
dirs = "5.0"
rfd = "0.15"

# HTTP for Model Downloads
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }

# Color Processing
palette = "0.7"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

# Async Runtime (for background processing)
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time"] }
parking_lot = "0.12"

# Memory tracking
sysinfo = "0.32"

# Random number generation
rand = "0.8"
sha2 = "0.10.9"
toml = "1.0.3"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "pixelforge"
path = "src/main.rs"
